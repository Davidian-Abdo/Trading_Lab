# Two services:
#   - lab         : the Streamlit dashboard + 3 in-process worker threads
#                   (crypto/forex/stocks). Crypto talks to Kraken over
#                   public HTTPS. Forex and stocks talk to the IB
#                   Gateway container below over the shared compose
#                   network at `ib-gateway:4002`.
#   - ib-gateway  : the official Interactive Brokers Gateway + IBC,
#                   wrapped in the well-known gnzsnz image. Runs in
#                   PAPER mode, read-only API, never sends real orders.
#
# Compose auto-creates a project network, so `IB_HOST=ib-gateway`
# resolves via Docker DNS — no extra_hosts needed.
#
# All credentials come from .env.shared (gitignored). Never commit it.
#
# Reach the dashboard from your laptop with an SSH tunnel:
#     ssh -L 8501:localhost:8501 lab@VPS_IP
#     open http://localhost:8501

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ----------------------------------------------------------------
  # IB Gateway (PAPER) — Java app + IBC, accessed via TCP from `lab`
  # ----------------------------------------------------------------
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: always
    # env_file passes TWS_USERID / TWS_PASSWORD / VNC_SERVER_PASSWORD
    # from .env.shared straight into the container — those names match
    # what the gnzsnz image expects, so no environment: remapping is
    # needed. (`${VAR}` interpolation inside this YAML would read from
    # the shell or a `.env` file in the project dir, NOT from env_file,
    # so the previous interpolation silently set them to empty.)
    env_file: ./.env.shared
    environment:
      # Always paper for this lab. Switching to "live" requires real
      # 2FA setup and is intentionally out of scope.
      TRADING_MODE: paper
      # Belt-and-braces: the IB API will refuse any order requests,
      # even if the lab code ever tried to place one (it doesn't).
      READ_ONLY_API: "yes"
      # Auto-accept incoming API connections from the `lab` container,
      # otherwise Gateway pops a click-through dialog every connect.
      TWS_ACCEPT_INCOMING: accept
      # Skip the "your version is out of date" nag screen.
      BYPASS_WARNING: "yes"
      # Daily soft-restart inside the container, before IBKR's nightly
      # maintenance window. Format: HH:MM (gateway local time).
      AUTO_RESTART_TIME: "03:00"
      # If 2FA ever times out (paper accounts don't trigger this; live
      # accounts do), exit cleanly so Docker restarts the container
      # instead of hanging the Gateway process.
      TWOFA_TIMEOUT_ACTION: exit
      RELOGIN_AFTER_TWOFA_TIMEOUT: "no"
      TIME_ZONE: Etc/UTC
      # API trust list (written into jts.ini at boot). Gateway's API
      # accepts TCP from anywhere, but it CLOSES the API session right
      # after the handshake unless the source IP appears here. The
      # default is "127.0.0.1" only, which kills connections from the
      # `lab` container (which talks to us across the compose bridge
      # network, not loopback). The static IP below is pinned via the
      # `labnet` network so this list stays valid across restarts.
      TRUSTED_IPS: "127.0.0.1,172.28.0.10"
      # VNC password (VNC_SERVER_PASSWORD) comes through env_file. If
      # left blank in .env.shared the gnzsnz image just skips starting
      # the VNC server. Bound to loopback in the ports section.
    networks:
      labnet:
        ipv4_address: 172.28.0.11
    ports:
      # API: paper port only, loopback on the host. The `lab` container
      # reaches it on the compose network, not via the host port — the
      # host port is exposed only so you can probe it from the VPS.
      - "127.0.0.1:4002:4002"
      # VNC for ad-hoc debugging via SSH tunnel. Comment out if unused.
      - "127.0.0.1:5900:5900"
    healthcheck:
      # bash is present in the gnzsnz image; /dev/tcp probes the port.
      # start_period covers the full Gateway cold start + IBC login.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/4002'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging: *default-logging

  # ----------------------------------------------------------------
  # Lab: dashboard + in-process worker threads
  # ----------------------------------------------------------------
  lab:
    build:
      context: .
      args:
        # Must match the host user that owns ./data. On the Hetzner VPS
        # the `lab` user is uid 1000; override here if yours differs.
        APP_UID: "1000"
        APP_GID: "1000"
    command: >
      streamlit run dashboard.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    env_file: ./.env.shared
    environment:
      # Lab settings
      DB_PATH: data/results.db
      MIN_TRADES: "20"
      WORKER_STALE_SECONDS: "600"
      START_EQUITY: "10000"
      ALLOC_FRACTION: "0.5"
      WORKER_AUTOSTART: "true"
      EMBED_WORKERS: "1"
      # IB pacing: ~60 historical requests per 10 min per connection.
      # 60s polling × many symbols × distinct timeframes will trip it.
      # 300s + the in-feed TTL cache keeps us comfortably under.
      POLL_SECONDS: "300"
      # Brokers
      CRYPTO_EXCHANGE: kraken
      IB_HOST: ib-gateway              # docker DNS → ib-gateway service
      IB_PORT: "4002"
      IB_CLIENT_ID_STOCKS: "11"        # MUST differ from forex clientId
      IB_CLIENT_ID_FOREX: "12"
      IB_MARKET_DATA_TYPE: "3"         # 3=delayed (no subscription needed)
      IB_CACHE_TTL: "120"
      # Dashboard env (also baked into the Dockerfile but kept here for
      # explicit visibility / overrideability).
      HOME: /app
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      ib-gateway:
        # Wait until IB Gateway's API port is open before starting the
        # worker threads. Avoids a flurry of "ib connect failed" errors
        # in the lab logs on first boot. Remove this block if Gateway
        # is ever flaky and you want the lab up regardless.
        condition: service_healthy
    restart: always
    volumes:
      - ./data:/app/data
    # Bind to loopback ONLY by default — reach via SSH tunnel from your
    # laptop. To expose publicly set DASHBOARD_PASSWORD in .env.shared,
    # change this to "8501:8501", and firewall the port to your IP.
    ports:
      - "127.0.0.1:8501:8501"
    networks:
      labnet:
        # Pinned IP so it appears in Gateway's TRUSTED_IPS list above.
        # Both addresses sit inside the `labnet` /24 below.
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *default-logging


# Dedicated bridge network with a pinned subnet so the lab and gateway
# containers get STABLE IPs across restarts. Without this, docker compose
# assigns IPs from its default pool, which would invalidate the
# TRUSTED_IPS list every time the project network was recreated.
networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
